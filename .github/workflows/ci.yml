# =============================================================================
# GitHub Actions - CI Pipeline
# Tests et validation du code
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Tests Python
  # ===========================================================================
  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # Erreurs de syntaxe ou noms non definis
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (ne bloque pas le build)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test imports
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production
        run: |
          python -c "from app import app; print('Flask app OK')"
          python -c "from config import get_config; print('Config OK')"
          python -c "from core.security import escape_ldap_filter; print('Security OK')"

      - name: Run test suite
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production
        run: |
          # test_api_diagnostic.py et test_api_full.py sont des scripts
          # `requests` qui visent un serveur deja demarre, et
          # test_connections.py est un script de diagnostic autonome aux
          # imports obsoletes (racine plutot que core/) : ce ne sont pas des
          # tests pytest, on les exclut de la collecte.
          pytest tests/ \
            --ignore=tests/test_api_diagnostic.py \
            --ignore=tests/test_api_full.py \
            --ignore=tests/test_connections.py \
            -v

  # ===========================================================================
  # Garde-fou : aucune donnee du domaine AD ne doit etre versionnee
  # Voir AUDIT_2026-07-20.md (constat C2) — ces fichiers ont deja fuite une
  # fois dans un depot public. Ce job DOIT bloquer le merge.
  # ===========================================================================
  no-sensitive-files:
    name: Aucun fichier sensible versionne
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Le motif utilise une inspection negative (?!...) : syntaxe PCRE, donc
      # `grep -P` SEUL. Combiner -E et -P fait repondre a grep
      # « conflicting matchers specified » (code 2) ; avec le `|| true` qui
      # suit, le job passait alors TOUJOURS au vert sans rien verifier.
      # L'auto-test ci-dessous existe pour que cette panne silencieuse ne
      # puisse pas se reproduire.
      - name: Auto-test du garde-fou (doit detecter un chemin interdit)
        run: |
          PATTERN='^(data/audit_history/|data/permissions\.json$|data/settings\.json$|data/crypto_salt\.bin$|data/backups/|data/user_templates\.json$|core/data/|logs/(?!\.gitkeep))'
          # Doit matcher un chemin interdit...
          if ! printf 'core/data/settings.json\n' | grep -qP "$PATTERN"; then
            echo "ECHEC : le garde-fou ne detecte plus les chemins interdits."
            echo "Le motif ou l'invocation de grep est casse — corrigez-le avant de merger."
            exit 1
          fi
          # ...et ne PAS matcher un chemin legitime.
          if printf 'README.md\nlogs/.gitkeep\n' | grep -qP "$PATTERN"; then
            echo "ECHEC : le garde-fou produit des faux positifs."
            exit 1
          fi
          echo "Auto-test du garde-fou : OK"

      - name: Verifier qu'aucun fichier sensible n'est suivi par git
        run: |
          echo "Fichiers suivis correspondant aux motifs interdits :"
          # core/settings_manager.py et core/session_crypto.py resolvent
          # certains chemins via os.path.dirname(__file__) : core/data/
          # a deja fuite (settings.json, crypto_salt.bin) sans que ce garde
          # ne le couvre, faute de motif dedie. Voir aussi .gitignore.
          FOUND=$(git ls-files | grep -P \
            '^(data/audit_history/|data/permissions\.json$|data/settings\.json$|data/crypto_salt\.bin$|data/backups/|data/user_templates\.json$|core/data/|logs/(?!\.gitkeep))' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo ""
            echo "ECHEC : ces fichiers contiennent des donnees du domaine AD de production."
            echo "Retirez-les du suivi git :  git rm -r --cached <chemin>"
            exit 1
          fi
          echo "  (aucun) — OK"

      - name: Verifier que .env n'est pas versionne
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ECHEC : .env est versionne."
            exit 1
          fi
          echo "OK"

      # Un fichier SUIVI que .gitignore declare ignore : le depot et sa
      # configuration se contredisent. Une regle .gitignore ne s'applique pas
      # a un fichier deja suivi, donc la regle ne protege rien et laisse
      # croire l'inverse — c'est ce qui a laisse core/data/settings.json etre
      # versionne malgre sa regle, puis le gitlink .claude/worktrees/.
      # `--no-index` est indispensable : sans lui, check-ignore ecarte
      # justement les fichiers suivis et ne verrait donc rien.
      # Les lignes ':N:!' sont les exceptions volontaires (!README.md, ...).
      - name: Aucun fichier suivi contredit par .gitignore
        run: |
          CONFLICTS=$(git ls-files \
            | git check-ignore --no-index --stdin --verbose 2>/dev/null \
            | grep -v ':[0-9]*:!' || true)
          if [ -n "$CONFLICTS" ]; then
            echo "$CONFLICTS"
            echo ""
            echo "ECHEC : ces fichiers sont suivis alors qu'une regle .gitignore les declare ignores."
            echo "Soit ils doivent rester versionnes -> retirez la regle .gitignore,"
            echo "soit ils ne doivent plus l'etre    -> git rm --cached <fichier>."
            exit 1
          fi
          echo "Depot et .gitignore coherents — OK"

      # Un gitlink (mode 160000) sans entree correspondante dans .gitmodules
      # fait echouer `git submodule foreach` a chaque checkout
      # (« No url found for submodule path », exit 128). C'est ce qui est
      # arrive avec .claude/worktrees/ : un repertoire de worktree commite
      # par inadvertance, qui polluait tous les runs CI.
      - name: Aucun gitlink orphelin (worktree/sous-module commite par erreur)
        run: |
          ORPHANS=$(git ls-files -s | awk '$1=="160000" {print $4}')
          if [ -n "$ORPHANS" ]; then
            for path in $ORPHANS; do
              if ! git config -f .gitmodules --get-regexp "submodule\..*\.path" 2>/dev/null | grep -qx ".* $path"; then
                echo "ECHEC : gitlink orphelin (aucune entree .gitmodules) : $path"
                echo "Retirez-le du suivi git :  git rm --cached $path"
                exit 1
              fi
            done
          fi
          echo "Aucun gitlink orphelin — OK"

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r . -x ./venv,./tests,./.git --severity-level medium -f json -o bandit-report.json || true
          bandit -r . -x ./venv,./tests,./.git --severity-level high || true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check || true  # Ne pas bloquer sur les warnings

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
